<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070914" />
  <title>Siapakah Aku?</title>
  <style>
    :root {
      --bg: #070914;
      --panel: rgba(17, 22, 44, .82);
      --text: #f5f7ff;
      --muted: #9ca8c9;
      --glow: #8b5cf6;
      --glow2: #22d3ee;
      --danger: #fb7185;
      --success: #5eead4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      display: grid; place-items: center; padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(91, 33, 182, .22), transparent 38%),
        radial-gradient(ellipse at 85% 80%, rgba(8, 145, 178, .16), transparent 40%),
        var(--bg);
    }
    #starfield { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .wrap { width: min(100%, 760px); position: relative; z-index: 1; }
    .card {
      border: 1px solid rgba(167, 139, 250, .23);
      background: var(--panel); backdrop-filter: blur(18px);
      border-radius: 28px; padding: clamp(24px, 6vw, 48px);
      box-shadow: 0 0 70px rgba(76, 29, 149, .15), inset 0 1px 0 rgba(255,255,255,.04);
      text-align: center;
    }
    .eyebrow {
      display: inline-flex; gap: 8px; align-items: center; justify-content: center;
      padding: 8px 12px; border: 1px solid rgba(139,92,246,.3);
      border-radius: 999px; color: #c4b5fd; font-size: .76rem; letter-spacing: .14em;
      text-transform: uppercase; background: rgba(139,92,246,.08);
    }
    .dot { width: 7px; height: 7px; background: var(--glow2); border-radius: 50%; box-shadow: 0 0 12px var(--glow2); }
    h1 { margin: 22px 0 10px; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.06; letter-spacing: -.045em; }
    .gradient { background: linear-gradient(100deg, #fff, #c4b5fd 45%, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .subtitle { color: var(--muted); line-height: 1.7; margin: 0 auto 28px; max-width: 480px; }
    form { max-width: 440px; margin: 0 auto; text-align: left; }
    label { display: block; font-size: .9rem; color: #dbe4ff; margin-bottom: 9px; }
    input {
      width: 100%; padding: 16px 17px; border-radius: 14px;
      border: 1px solid rgba(148,163,184,.25); background: rgba(3,7,18,.7);
      color: white; font: inherit; outline: none; transition: .2s;
    }
    input:focus { border-color: var(--glow); box-shadow: 0 0 0 4px rgba(139,92,246,.14); }
    input::placeholder { color: #64708f; }
    button {
      width: 100%; border: 0; border-radius: 14px; padding: 15px 18px; margin-top: 12px;
      color: white; font: inherit; font-weight: 700; cursor: pointer;
      background: linear-gradient(100deg, #7c3aed, #6366f1 55%, #0891b2);
      box-shadow: 0 8px 28px rgba(99,102,241,.24); transition: transform .2s, filter .2s;
    }
    button:hover { filter: brightness(1.12); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #a5f3fc; outline-offset: 3px; }
    #feedback { min-height: 25px; margin: 14px 0 0; font-size: .92rem; color: var(--danger); text-align: center; }
    .hint { color: #6f7b9d; font-size: .78rem; text-align: center; margin-top: 16px; }
    #result { display: none; margin-top: 24px; }
    #result.show { display: block; animation: rise .8s ease both; }
    .success-label { color: var(--success); letter-spacing: .16em; text-transform: uppercase; font-size: .78rem; font-weight: 700; }
    #particleCanvas { display: block; width: 100%; height: 230px; margin: 8px auto 0; }
    .final-caption { color: #a5f3fc; text-shadow: 0 0 22px rgba(34,211,238,.45); margin: 0; }
    .again { max-width: 220px; margin-top: 20px; background: rgba(148,163,184,.12); border: 1px solid rgba(148,163,184,.2); box-shadow: none; }
    .footer { text-align: center; color: #66708d; font-size: .75rem; margin-top: 18px; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { body { padding: 14px; } .card { border-radius: 22px; } #particleCanvas { height: 190px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <main class="wrap">
    <section class="card">
      <div class="eyebrow"><span class="dot"></span> A LITTLE MYSTERY</div>
      <h1><span class="gradient">Siapakah Aku?</span></h1>
      <p class="subtitle">Ada satu pertanyaan untukmu. Coba tebak jawabannya, lalu lihat apa yang tersembunyi di balik cahaya ini.</p>

      <form id="answerForm">
        <label for="answerInput">Tulis jawabanmu</label>
        <input id="answerInput" type="text" placeholder="Ketik jawaban di sini..." autocomplete="off" required />
        <button type="submit">Buka jawabannya <span aria-hidden="true">↗</span></button>
        <p id="feedback" role="status" aria-live="polite"></p>
      </form>
      <p class="hint">Psst… perhatikan huruf besar dan kecil tidak berpengaruh.</p>

      <section id="result" aria-live="polite">
        <div class="success-label">✦ Kamu benar ✦</div>
        <canvas id="particleCanvas" aria-label="Animasi partikel membentuk kata"></canvas>
        <p class="final-caption">Sebuah pesan, dibentuk dari cahaya.</p>
        <button type="button" id="tryAgain" class="again">Coba lagi</button>
      </section>
    </section>
    <p class="footer">Made of pixels, particles, and a little mystery.</p>
  </main>

  <script>
    /*
      ============================
      UBAH PENGATURAN DI BAGIAN INI
      ============================
      GANTI jawabanBenar dan kataRahasia sesuai keinginanmu.
      Contoh:
        const jawabanBenar = "asip";
        const kataRahasia = "I MISS YOU";
    */
    const jawabanBenar = "asip";
    const kataRahasia = "I MISS YOU";

    const form = document.getElementById("answerForm");
    const input = document.getElementById("answerInput");
    const feedback = document.getElementById("feedback");
    const result = document.getElementById("result");
    const tryAgain = document.getElementById("tryAgain");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const jawaban = input.value.trim().toLocaleLowerCase("id-ID");
      if (jawaban === jawabanBenar.trim().toLocaleLowerCase("id-ID")) {
        feedback.textContent = "";
        result.classList.add("show");
        form.style.display = "none";
        document.querySelector(".hint").style.display = "none";
        startWordAnimation(kataRahasia);
      } else {
        feedback.textContent = "Belum tepat 😶 Coba pikirkan lagi, lalu coba sekali lagi.";
        input.focus();
        input.select();
      }
    });

    tryAgain.addEventListener("click", () => {
      result.classList.remove("show");
      result.style.display = "none";
      // Re-enable the result section for the next correct attempt.
      result.style.display = "";
      form.style.display = "";
      document.querySelector(".hint").style.display = "";
      input.value = "";
      feedback.textContent = "";
      input.focus();
    });

    // Background starfield: lightweight and responsive.
    const starCanvas = document.getElementById("starfield");
    const starCtx = starCanvas.getContext("2d");
    let stars = [];
    function resizeStars() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      starCanvas.width = innerWidth * dpr;
      starCanvas.height = innerHeight * dpr;
      starCanvas.style.width = innerWidth + "px";
      starCanvas.style.height = innerHeight + "px";
      starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = Array.from({ length: Math.min(100, Math.floor(innerWidth / 10)) }, () => ({
        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: Math.random() * 1.5 + .25, a: Math.random() * .55 + .15,
        drift: (Math.random() - .5) * .15
      }));
    }
    function drawStars() {
      starCtx.clearRect(0, 0, innerWidth, innerHeight);
      for (const s of stars) {
        s.x += s.drift;
        if (s.x < 0) s.x = innerWidth;
        if (s.x > innerWidth) s.x = 0;
        starCtx.beginPath();
        starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starCtx.fillStyle = `rgba(190, 205, 255, ${s.a})`;
        starCtx.fill();
      }
      requestAnimationFrame(drawStars);
    }
    window.addEventListener("resize", resizeStars);
    resizeStars();
    drawStars();

    // Build a target point cloud from text, then move glowing particles into it.
    let animationFrame = null;
    function startWordAnimation(word) {
      const canvas = document.getElementById("particleCanvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, rect.width * dpr);
      canvas.height = Math.max(1, rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = rect.width, h = rect.height;

      // Draw text off-screen to find the pixels that make up each letter.
      const off = document.createElement("canvas");
      off.width = Math.floor(w * dpr);
      off.height = Math.floor(h * dpr);
      const offCtx = off.getContext("2d");
      offCtx.scale(dpr, dpr);
      const fontSize = Math.min(78, w / Math.max(4.5, word.length * .57));
      offCtx.font = `800 ${fontSize}px system-ui, sans-serif`;
      offCtx.textAlign = "center";
      offCtx.textBaseline = "middle";
      offCtx.fillStyle = "#fff";
      offCtx.fillText(word, w / 2, h / 2, w * .94);

      const pixels = offCtx.getImageData(0, 0, off.width, off.height).data;
      const targets = [];
      const step = Math.max(3, Math.round(4 * dpr));
      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          const idx = (y * off.width + x) * 4;
          if (pixels[idx + 3] > 100) targets.push({ x: x / dpr, y: y / dpr });
        }
      }
      if (!targets.length) return;
      const count = Math.min(targets.length, 1500);
      const chosen = [];
      for (let i = 0; i < count; i++) chosen.push(targets[Math.floor(i * targets.length / count)]);
      const particles = chosen.map((t, i) => ({
        x: Math.random() * w, y: Math.random() * h,
        tx: t.x, ty: t.y, size: Math.random() * 1.5 + .7,
        phase: Math.random() * Math.PI * 2, hue: i % 3
      }));
      const start = performance.now();
      if (animationFrame) cancelAnimationFrame(animationFrame);

      function frame(now) {
        ctx.clearRect(0, 0, w, h);
        const progress = Math.min(1, (now - start) / 2200);
        const eased = 1 - Math.pow(1 - progress, 3);

        // A soft halo behind the word.
        const glow = ctx.createRadialGradient(w/2, h/2, 4, w/2, h/2, w*.48);
        glow.addColorStop(0, "rgba(124,58,237,.12)");
        glow.addColorStop(1, "rgba(7,9,20,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        for (const p of particles) {
          const shimmer = Math.sin(now * .002 + p.phase) * 1.5;
          const x = p.x + (p.tx - p.x) * eased;
          const y = p.y + (p.ty - p.y) * eased;
          const px = progress < 1 ? x : p.tx + Math.sin(now * .0015 + p.phase) * .8;
          const py = progress < 1 ? y : p.ty + Math.cos(now * .0017 + p.phase) * .8;
          const color = p.hue === 0 ? "139,92,246" : p.hue === 1 ? "34,211,238" : "221,214,254";
          ctx.beginPath();
          ctx.arc(px, py, p.size + (progress === 1 ? shimmer * .12 : 0), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${color},${.72 + .28 * Math.sin(now*.003+p.phase)**2})`;
          ctx.shadowColor = `rgb(${color})`;
          ctx.shadowBlur = progress < 1 ? 8 : 12;
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        if (progress < 1) animationFrame = requestAnimationFrame(frame);
        else animationFrame = requestAnimationFrame(frame); // Keep a gentle shimmer.
      }
      animationFrame = requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
